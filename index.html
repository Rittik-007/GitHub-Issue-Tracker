<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - GitHub Issue Tracker</title>
    <link rel="shortcut icon" href="icons/problem-solving.png" type="image/x-icon">

    <!-- font links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- daisyUi links -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style/log-in.css">
</head>

<body>

    <section class="w-full h-full p-5">
        <form class="bg-white mx-auto max-w-110 p-7 rounded-[8px] shadow">
            <div class="form-logo text-center mb-6">
                <img src="icons/github-logo.png" alt="" class="mx-auto">
                <h2 class="text-2xl text-gray-800 font-bold mt-4 mb-1">GitHub Issues Tracker</h2>
                <p class="text-gray-600">Sign in to manage your issues</p>
            </div>
            <div class="input-fields">
                <div class="flex flex-col mb-4">
                    <label for="username-input" class="block mb-1 text-gray-800">Username</label>
                    <input id="username-input" type="text">
                </div>
                <div class="flex flex-col">
                    <label for="password-input" class="block mb-1 text-gray-800">Password</label>
                    <input id="password-input" type="text">
                </div>
                <div class="flex flex-col mt-6">
                    <button type="button" id="btn-signIn" class="btn btn-primary text-white cursor-pointer">Sign In</button>
                </div>
            </div>
            <p class="text-gray-400 text-2xl text-center my-5">---------- <span class="font-semibold text-gray-900">OR</span> ----------</p>
            <div class="text-center">
                <p>Demo Credentials:</p>
                <div class="bg-neutral-100 p-4 rounded-md">
                    <p><span class="font-bold">Username: </span> admin</p>
                    <p><span class="font-bold">Password: </span> 1234</p>
                </div>
            </div>
        </form>
    </section>

    <script src="js/log-in.js"></script>
</body>

</html>
